<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>User Registration</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="container">
      <section class="registration-card">
        <div class="header">
          <p class="eyebrow">FULL-STACK CRUD PRACTICE</p>

          <h1>Create an Account</h1>

          <p class="description">
            Register a user and follow the complete journey from the browser to
            MySQL.
          </p>
        </div>

        <form id="registration-form">
          <div class="form-group">
            <label for="name">Full Name</label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <button type="submit">Create User</button>
        </form>

        <p id="message" class="message"></p>
      </section>
      <section class="users-section">
        <div class="users-header">
          <h2>Registered Users</h2>

          <button id="load-users" type="button">Load Users</button>
        </div>

        <div id="users-list" class="users-list"></div>
      </section>
      <section id="edit-section" class="edit-section">
  <h2>Edit User</h2>

  <form id="edit-form">
    <input type="hidden" id="edit-id" />

    <div class="form-group">
      <label for="edit-name">Full Name</label>

      <input
        type="text"
        id="edit-name"
        required
      />
    </div>

    <div class="form-group">
      <label for="edit-email">Email Address</label>

      <input
        type="email"
        id="edit-email"
        required
      />
    </div>

    <button type="submit">
      Update User
    </button>
  </form>
</section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
